[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-video-analytics"
version = "0.1.0"
description = "Line counting and zone occupancy from video with detection + tracking"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]
video = ["ultralytics"]

[tool.setuptools.packages.find]
where = ["src"]